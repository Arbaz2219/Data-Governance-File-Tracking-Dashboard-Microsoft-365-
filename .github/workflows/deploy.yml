name: Build & Deploy (Full CI/CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      backend_tag: latest
      frontend_tag: latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: arbazm221/ldp_backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          no-cache: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: arbazm221/ldp_frontend:latest

  deploy:
    name: SSH & Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd /root/Data-Governance-File-Tracking-Dashboard-Microsoft-365-

            # Pull through compose so the images that actually get started are the
            # ones refreshed. Pulling hardcoded :latest tags here instead silently
            # does nothing whenever .env.prod points BACKEND_IMAGE/FRONTEND_IMAGE
            # somewhere else, which is how production went stale.
            echo "Images compose will run:"
            grep -E '^(BACKEND_IMAGE|FRONTEND_IMAGE)=' .env.prod

            echo "Pulling..."
            sudo docker-compose --env-file .env.prod pull

            echo "Recreating containers..."
            sudo docker-compose --env-file .env.prod up -d --force-recreate --remove-orphans

            echo "Now running:"
            sudo docker-compose --env-file .env.prod ps

      # A green deploy that leaves a months-old container serving traffic is the
      # exact failure this pipeline had, so assert the live site actually moved.
      - name: Verify production serves the new build
        run: |
          URL=https://ldpm365.ldplogistics.com/
          for i in $(seq 1 10); do
            LM=$(curl -sSI --max-time 20 "$URL" | tr -d '\r' | sed -n 's/^[Ll]ast-[Mm]odified: //p')
            echo "attempt $i: Last-Modified: ${LM:-<none>}"
            if [ -n "$LM" ]; then
              AGE=$(( $(date -u +%s) - $(date -u -d "$LM" +%s) ))
              if [ "$AGE" -lt 3600 ]; then
                echo "Production is serving a build from ${AGE}s ago."
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::Production still serves a stale build. The containers on the server were not replaced - check that BACKEND_IMAGE/FRONTEND_IMAGE in .env.prod match the tags this workflow pushes."
          exit 1
