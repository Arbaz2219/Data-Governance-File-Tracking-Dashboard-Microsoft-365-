name: Build & Deploy (Full CI/CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      backend_tag: latest
      frontend_tag: latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: arbazm221/ldp_backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          no-cache: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: arbazm221/ldp_frontend:latest

  deploy:
    name: SSH & Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            APP_DIR=/root/Data-Governance-File-Tracking-Dashboard-Microsoft-365-
            cd "$APP_DIR" || { echo "FATAL: $APP_DIR does not exist on this server."; exit 1; }

            # Preflight, so a broken deploy names its cause instead of dying on a
            # cryptic compose error the way this one silently did for months.
            if [ ! -f .env.prod ]; then
              echo "FATAL: .env.prod is missing in $APP_DIR."
              echo "compose needs it for both env_file and --env-file. Directory contains:"
              ls -la
              exit 1
            fi

            if command -v docker-compose >/dev/null 2>&1; then
              DC="sudo docker-compose"
            elif sudo docker compose version >/dev/null 2>&1; then
              DC="sudo docker compose"
            else
              echo "FATAL: neither 'docker-compose' nor 'docker compose' is installed."
              exit 1
            fi
            echo "Using compose command: $DC"

            # compose reads the docker-compose.yml sitting on the server, and
            # nothing here ever refreshed it - so the file in use predates the
            # repo's and the backend container ended up with a single Traefik
            # label and no router. Only this one file is synced; .env.prod is
            # untracked and stays put.
            echo "Syncing docker-compose.yml from origin/main..."
            git fetch --quiet origin main
            git checkout origin/main -- docker-compose.yml
            echo "Other local divergence in this checkout (informational):"
            git status --short || true

            # Pull through compose so the images that actually get started are the
            # ones refreshed. Pulling hardcoded :latest tags here instead does
            # nothing whenever .env.prod points these vars somewhere else.
            echo "Images compose will run:"
            grep -E '^(BACKEND_IMAGE|FRONTEND_IMAGE)=' .env.prod || {
              echo "FATAL: BACKEND_IMAGE / FRONTEND_IMAGE are not set in .env.prod."
              exit 1
            }

            $DC --env-file .env.prod pull
            $DC --env-file .env.prod up -d --force-recreate --remove-orphans
            $DC --env-file .env.prod ps

            # Any container here that compose did not just create is a stray from an
            # older deploy, and Traefik may still be routing traffic to it.
            echo "All running containers:"
            sudo docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.RunningFor}}'

      # A green deploy that leaves a months-old container serving traffic is the
      # exact failure this pipeline had, so assert the live site actually moved.
      - name: Verify production serves the new build
        run: |
          URL=https://ldpm365.ldplogistics.com/
          for i in $(seq 1 10); do
            LM=$(curl -sSI --max-time 20 "$URL" | tr -d '\r' | sed -n 's/^[Ll]ast-[Mm]odified: //p')
            echo "attempt $i: Last-Modified: ${LM:-<none>}"
            if [ -n "$LM" ]; then
              AGE=$(( $(date -u +%s) - $(date -u -d "$LM" +%s) ))
              if [ "$AGE" -lt 3600 ]; then
                echo "Production is serving a build from ${AGE}s ago."
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::Production still serves a stale build. The containers on the server were not replaced - check that BACKEND_IMAGE/FRONTEND_IMAGE in .env.prod match the tags this workflow pushes."
          exit 1

      # The API silently fell out of Traefik's routing table once and nobody
      # noticed, because a dashboard with no data looks the same as a slow one.
      - name: Verify the API is routed
        run: |
          # Traefik needs a few seconds to register a freshly recreated
          # container, so poll rather than judging on the first response.
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              https://apildpm365.ldplogistics.com/api/audit-logs || true)
            echo "attempt $i: GET /api/audit-logs without a key -> $CODE"
            # 403 is the healthy answer: the request reached Express and its
            # dashboard-key middleware rejected it. 404 means Traefik has no
            # route to the backend container at all.
            if [ "$CODE" = "403" ]; then
              echo "API is reachable."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Expected 403 from the API, got $CODE. Traefik is not routing to the backend container."
          exit 1
