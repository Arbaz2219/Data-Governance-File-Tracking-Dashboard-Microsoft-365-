name: Build & Deploy (Full CI/CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      backend_tag: latest
      frontend_tag: latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: arbazm221/ldp_backend:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: arbazm221/ldp_frontend:latest

  deploy:
    name: SSH & Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "Navigating to project directory..."
            cd /root/Data-Governance-File-Tracking-Dashboard-Microsoft-365-

            echo "CLEANING: Stopping and removing old containers..."
            sudo docker-compose --env-file .env.prod down

            echo "CLEANING: Pruning everything to force clean layers..."
            sudo docker system prune -f

            echo "PULLING: Fetching latest images from Hub..."
            sudo docker-compose --env-file .env.prod pull

            echo "RESTARTING: Starting services..."
            sudo docker-compose --env-file .env.prod up -d

            echo "✅ Force Deployment Successful!"
